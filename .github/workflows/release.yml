name: Release Builds

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: BafangTool-linux-x64
            exe_path: dist/BafangTool
            release_file: BafangTool-linux-x64
          - os: windows-latest
            artifact_name: BafangTool-windows-x64
            exe_path: dist/BafangTool.exe
            release_file: BafangTool-windows-x64.exe
          - os: macos-latest
            artifact_name: BafangTool-macos-x64
            exe_path: dist/BafangTool
            release_file: BafangTool-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name BafangTool app.py \
            --add-data "templates${{ runner.os == 'Windows' && ';' || ':' }}templates" \
            --add-data "bafang${{ runner.os == 'Windows' && ';' || ':' }}bafang"
        shell: bash

      - name: Compute release filename (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "RELEASE_FILE=BafangTool-${GITHUB_REF_NAME}-linux-x64" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=BafangTool-${GITHUB_REF_NAME}-linux-x64" >> $GITHUB_ENV

      - name: Compute release filename (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "RELEASE_FILE=BafangTool-${GITHUB_REF_NAME}-macos-x64" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=BafangTool-${GITHUB_REF_NAME}-macos-x64" >> $GITHUB_ENV

      - name: Compute release filename (Windows)
        if: runner.os == 'Windows'
        run: |
          "RELEASE_FILE=BafangTool-${env:GITHUB_REF_NAME}-windows-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARTIFACT_NAME=BafangTool-${env:GITHUB_REF_NAME}-windows-x64" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Prepare release file (Linux/macOS)
        if: runner.os != 'Windows'
        run: cp "${{ matrix.exe_path }}" "${RELEASE_FILE}"

      - name: Prepare release file (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item -Path "${{ matrix.exe_path }}" -Destination "${env:RELEASE_FILE}" -Force
        shell: pwsh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RELEASE_FILE }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_FILE }}
