name: Release Builds

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: BafangTool-linux-x64
            exe_path: dist/BafangTool
            release_file: BafangTool-linux-x64
          - os: windows-latest
            artifact_name: BafangTool-windows-x64
            exe_path: dist/BafangTool.exe
            release_file: BafangTool-windows-x64.exe
          - os: macos-latest
            artifact_name: BafangTool-macos-x64
            exe_path: dist/BafangTool
            release_file: BafangTool-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name BafangTool app.py \
            --add-data "templates${{ runner.os == 'Windows' && ';' || ':' }}templates" \
            --add-data "bafang${{ runner.os == 'Windows' && ';' || ':' }}bafang"
        shell: bash

      - name: Prepare release file (Linux/macOS)
        if: runner.os != 'Windows'
        run: cp "${{ matrix.exe_path }}" "${{ matrix.release_file }}"

      - name: Prepare release file (Windows)
        if: runner.os == 'Windows'
        run: copy "${{ matrix.exe_path }}" "${{ matrix.release_file }}"
        shell: cmd

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.release_file }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_file }}
